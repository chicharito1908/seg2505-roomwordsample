plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.roomwordsample'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.roomwordsample"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    // Room Database : pour enregistrer les mots dans une base de données SQLite
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

// Lifecycle, LiveData et ViewModel : pour gérer les données affichées à l'écran.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

// RecyclerView: pour gérer les données affichées à l'écran.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}